<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesture Draw 2D · Жестовое управление</title>
<style>
:root {
  --bg-deep: #050508;
  --glass-dark: rgba(8, 12, 18, 0.96);
  --glass-border: rgba(75, 227, 255, 0.35);
  --accent-primary: #4be3ff;
  --text-light: rgba(255, 255, 255, 0.95);
  --text-soft: rgba(255, 255, 255, 0.75);
  --surface-elevated: rgba(22, 28, 40, 0.95);
  --surface-hover: rgba(40, 48, 65, 0.98);
  --shadow-xl: 0 24px 48px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05), inset 0 1px 0 rgba(255,255,255,0.08);
  --transition-smooth: all 0.35s cubic-bezier(0.2, 0, 0, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg-deep);
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  color: var(--text-light);
}
#pinchCursor {
  position: fixed; width: 36px; height: 36px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(75,227,255,0.95), rgba(0,180,255,0.9));
  box-shadow: 0 0 30px rgba(75,227,255,0.7), 0 0 60px rgba(75,227,255,0.3),
              inset 0 0 0 2px rgba(255,255,255,0.9);
  transform: translate(-50%, -50%); pointer-events: none; z-index: 9999;
  /* Плавный доезд между кадрами трекинга — короткий transition на позицию */
  transition: left 0.07s linear, top 0.07s linear,
              transform 0.18s cubic-bezier(0.34,1.56,0.64,1),
              background 0.25s ease, box-shadow 0.25s ease, width 0.2s, height 0.2s;
  border: 1px solid rgba(255,255,255,0.2);
  will-change: left, top, transform;
}
#pinchCursor.active {
  transform: translate(-50%,-50%) scale(1.7);
  background: radial-gradient(circle at 30% 30%, #ff6b6b, #ff4757);
  box-shadow: 0 0 40px #ff6b6b, 0 0 90px #ff4757, inset 0 0 0 3px rgba(255,255,255,0.9);
  width: 32px; height: 32px;
}
#pinchCursor.ui-mode {
  background: radial-gradient(circle at 30% 30%, #c084fc, #9f7aea);
  box-shadow: 0 0 40px #c084fc, 0 0 90px #9f7aea, inset 0 0 0 3px white;
  transform: translate(-50%,-50%) scale(1.4); width: 40px; height: 40px;
}
.cursor-fist {
  background: radial-gradient(circle at 30% 30%, #5ddcff, #3b9eff) !important;
  box-shadow: 0 0 60px #5ddcff, 0 0 120px #3b9eff, inset 0 0 0 4px white !important;
  transform: translate(-50%,-50%) scale(1.8) !important;
  width: 44px !important; height: 44px !important;
}
#camera {
  position: fixed; inset: 0; width: 100vw; height: 100vh;
  object-fit: cover; z-index: 0;
  transition: opacity 0.5s, transform 0.4s;
  filter: brightness(0.85) contrast(1.2);
}
#camera.mirrored { transform: scaleX(-1); }
#camera.hidden { opacity: 0; visibility: hidden; }
#bgColorOverlay {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(circle at 50% 50%, #0b0b14, #050508);
  transition: opacity 0.5s; opacity: 0; pointer-events: none;
}
#bgColorOverlay.visible { opacity: 1; }
#canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 5; cursor: none; pointer-events: none; }
#skeletonCanvas { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 6; pointer-events: none; transition: opacity 0.3s; }
#skeletonCanvas.hidden { opacity: 0; }
#toggleSidebar {
  position: fixed;
  left: 24px;
  top: 24px; /* <-- Вернули кнопку в самый верхний угол */
  width: 56px;
  height: 56px;
  background: var(--surface-elevated);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(75,227,255,0.2);
  border-radius: 24px;
  color: white;
  cursor: pointer;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition-smooth);
  box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  font-size: 24px;
}

/* Стили при наведении остаются прежними */
#toggleSidebar:hover {
  background: rgba(48,58,80,0.9);
  border-color: var(--accent-primary);
  box-shadow: 0 0 30px rgba(75,227,255,0.3);
  transform: scale(1.1) rotate(5deg);
}
.hot-zone {
  position: fixed; z-index: 700; pointer-events: none;
  display: flex; align-items: center; justify-content: center;
  /* Матовое стекло как у панелей */
  background: linear-gradient(160deg, rgba(28, 34, 50, 0.62) 0%, rgba(14, 18, 28, 0.68) 100%);
  backdrop-filter: blur(28px) saturate(170%) brightness(1.05);
  -webkit-backdrop-filter: blur(28px) saturate(170%) brightness(1.05);
  border: 1.5px solid rgba(75, 227, 255, 0.35);
  box-shadow:
    0 18px 36px -10px rgba(0,0,0,0.55),
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    inset 0 -1px 0 rgba(0, 0, 0, 0.35),
    inset 0 0 0 1px rgba(75, 227, 255, 0.12);
  transition: background 0.3s, border-color 0.3s, opacity 0.4s, box-shadow 0.3s;
}
.hot-zone.hovered {
  background: linear-gradient(160deg, rgba(75,227,255,0.42) 0%, rgba(75,227,255,0.22) 100%);
  border-color: rgba(75,227,255,0.95);
  box-shadow:
    0 22px 44px -10px rgba(0,0,0,0.6),
    inset 0 1px 0 rgba(255, 255, 255, 0.32),
    inset 0 0 30px rgba(75, 227, 255, 0.25),
    0 0 44px rgba(75,227,255,0.5);
}
.hz-hint {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  opacity: 0.85; transition: opacity 0.3s; pointer-events: none; user-select: none;
}
.hot-zone.hovered .hz-hint { opacity: 1; }
.hz-hint span {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  color: #fff;
  white-space: nowrap;
  text-shadow: 0 0 10px rgba(75,227,255,0.8), 0 2px 4px rgba(0,0,0,0.6);
}
.hz-dots { display: flex; gap: 8px; }
.hz-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent-primary);
  opacity: 0.95;
  box-shadow: 0 0 8px var(--accent-primary);
}

/* 🔺 ПЕРЕМЕЩЕНО НАВЕРХ + ШИРИНА КАК У ПАНЕЛЕЙ */
#hotZoneBottom {
  top: 0; bottom: auto; left: 50%; transform: translateX(-50%);
  width: 420px; height: 75px;
  border-radius: 0 0 48px 48px; border-top: none;
}

/* 🔲 КВАДРАТ 420×420 В ЦЕНТРЕ */
#hotZoneCenter {
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 420px; height: 420px;
  border-radius: 44px; opacity: 0;
  transition: opacity 0.45s cubic-bezier(0.16,1,0.3,1), background 0.3s, border-color 0.3s;
}
#hotZoneCenter.panels-open { opacity: 1; }
.hz-close-icon { font-size: 32px; opacity: 0; transition: opacity 0.3s, transform 0.3s; filter: drop-shadow(0 0 10px var(--accent-primary)); transform: scale(0.85); }
#hotZoneCenter.hovered .hz-close-icon { opacity: 1; transform: scale(1.1); }

/* 🔵 ОБНОВЛЁННОЕ КОЛЬЦО УДЕРЖАНИЯ */
#holdRing { position: fixed; width: 72px; height: 72px; border-radius: 50%; pointer-events: none; z-index: 9998; transform: translate(-50%,-50%) scale(0.8); opacity: 0; transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), opacity 0.25s; }
#holdRing.active { opacity: 1; transform: translate(-50%,-50%) scale(1); }
#holdRing.complete { animation: ringPop 0.35s cubic-bezier(0.2,0.8,0.2,1) forwards; }
@keyframes ringPop { 0%{transform:translate(-50%,-50%) scale(1);} 40%{transform:translate(-50%,-50%) scale(1.35);} 100%{transform:translate(-50%,-50%) scale(0.7); opacity:0;} }
#holdRing svg { width: 100%; height: 100%; transform: rotate(-90deg); }
#holdRing circle.track { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 5; }
#holdRing circle.progress { fill: none; stroke: var(--accent-primary); stroke-width: 5; stroke-linecap: round; stroke-dasharray: 200; stroke-dashoffset: 200; filter: drop-shadow(0 0 10px var(--accent-primary)); transition: stroke-dashoffset 0.1s linear; }

.panels-container { position: fixed; inset: 0; pointer-events: none; z-index: 800; }

/* 🔲 ПАНЕЛИ: МАТОВОЕ ЖИДКОЕ СТЕКЛО */
#toolsPanel, #settingsPanel {
  position: fixed; top: 90px; width: 420px;
  /* Матовое стекло: плотный blur + лёгкая насыщенность + slight brightness */
  background: linear-gradient(160deg, rgba(28, 34, 50, 0.55) 0%, rgba(14, 18, 28, 0.62) 100%);
  backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
  -webkit-backdrop-filter: blur(40px) saturate(180%) brightness(1.05);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 38px; z-index: 900;
  display: flex; flex-direction: column; padding: 28px 24px; gap: 24px;
  transition: transform 0.5s cubic-bezier(0.16,1,0.3,1), opacity 0.4s, box-shadow 0.3s;
  /* Многослойные тени: внешняя глубина + verхний specular highlight + нижняя теневая кромка + тонкая cyan-каёмка */
  box-shadow:
    0 32px 64px -16px rgba(0, 0, 0, 0.7),
    0 12px 24px -8px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.18),
    inset 0 -1px 0 rgba(0, 0, 0, 0.35),
    inset 0 0 0 1px rgba(75, 227, 255, 0.06);
  opacity: 0; pointer-events: none;
  max-height: calc(100vh - 120px); overflow-y: auto; will-change: transform, opacity;
  color: var(--text-light);
}
#toolsPanel { left: 20px; transform: translateX(-140%); }
#settingsPanel { right: 20px; transform: translateX(140%); }
#toolsPanel.visible, #settingsPanel.visible { transform: translateX(0); opacity: 1; pointer-events: auto; }

/* Остальные стили панелей без изменений, только подкрашены для контраста */
#toolsPanel::-webkit-scrollbar, #settingsPanel::-webkit-scrollbar { width: 4px; }
#toolsPanel::-webkit-scrollbar-track, #settingsPanel::-webkit-scrollbar-track { background: transparent; margin-block: 16px; }
#toolsPanel::-webkit-scrollbar-thumb, #settingsPanel::-webkit-scrollbar-thumb { background: rgba(93,220,255,0.4); border-radius: 20px; }
.panel-indicator {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(12, 16, 24, 0.85);
  backdrop-filter: blur(10px);
  color: var(--accent-primary);
  padding: 8px 22px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  box-shadow: 0 4px 14px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
  border: 1px solid rgba(75, 227, 255, 0.25);
  white-space: nowrap;
  z-index: 10;
}

/* 🔽 Добавляем отступ первому разделу, чтобы заголовок не перекрывал контент */
.section:first-of-type {
  margin-top: 32px;
}

/* 📐 Немного увеличиваем верхний отступ панелей для баланса */
#toolsPanel, #settingsPanel {
  padding-top: 67px;
}
.section { display: flex; flex-direction: column; gap: 14px; }
.section-title { font-size: 17px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: #fff; padding-left: 6px; border-left: 3px solid var(--accent-primary); line-height: 1.2; text-shadow: 0 0 12px rgba(75,227,255,0.4); }
.button-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
.button-row { display: flex; gap: 10px; }
/* Прозрачные стеклянные кнопки — liquid glass */
.btn {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.035) 0%, rgba(255, 255, 255, 0) 100%);
  border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--text-soft);
  padding: 14px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1),
              background 0.3s ease, border-color 0.3s ease,
              box-shadow 0.35s ease, color 0.3s ease;
  font-size: 19px;
  font-weight: 600;
  text-align: center;
  flex: 1;
  min-height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  /* Тонкое стекло поверх панели */
  backdrop-filter: blur(14px) saturate(170%);
  -webkit-backdrop-filter: blur(14px) saturate(170%);
  /* Specular на верхнем краю + теневая кромка снизу */
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.22),
    inset 0 -1px 0 rgba(0, 0, 0, 0.25),
    inset 0 0 0 1px rgba(255, 255, 255, 0.04),
    0 6px 14px rgba(0, 0, 0, 0.25);
  position: relative;
  overflow: hidden;
  letter-spacing: 0.3px;
}
/* Сканирующий блик при наведении */
.btn::before {
  content: ''; position: absolute;
  top: 0; left: -120%;
  width: 100%; height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.18), transparent);
  transition: left 0.65s ease;
  pointer-events: none;
}
.btn:hover::before { left: 120%; }
.btn::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at 50% 50%, rgba(75,227,255,0.18), transparent 70%);
  opacity: 0; transition: opacity 0.3s;
  pointer-events: none;
}
.btn:hover::after { opacity: 1; }
.btn:hover {
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
  border-color: rgba(75, 227, 255, 0.55);
  transform: translateY(-3px);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.32),
    inset 0 -1px 0 rgba(0, 0, 0, 0.3),
    0 16px 28px -8px rgba(0, 0, 0, 0.55),
    0 0 30px rgba(75, 227, 255, 0.25);
  color: #fff;
}
.btn:active {
  transform: translateY(-1px) scale(0.97);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.18),
    inset 0 -1px 0 rgba(0, 0, 0, 0.4),
    0 4px 10px rgba(0, 0, 0, 0.5);
  transition: transform 0.1s ease;
}
.btn.active {
  background: linear-gradient(160deg, rgba(75, 227, 255, 0.13) 0%, rgba(75, 227, 255, 0.03) 100%);
  border-color: rgba(75, 227, 255, 0.65);
  color: var(--accent-primary);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.25),
    inset 0 -1px 0 rgba(0, 0, 0, 0.2),
    0 0 32px rgba(75, 227, 255, 0.45),
    inset 0 0 18px rgba(75, 227, 255, 0.12);
  animation: btnActivePulse 2.6s ease-in-out infinite;
}
@keyframes btnActivePulse {
  0%, 100% {
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.25),
      inset 0 -1px 0 rgba(0, 0, 0, 0.2),
      0 0 32px rgba(75, 227, 255, 0.45),
      inset 0 0 18px rgba(75, 227, 255, 0.12);
  }
  50% {
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.32),
      inset 0 -1px 0 rgba(0, 0, 0, 0.2),
      0 0 48px rgba(75, 227, 255, 0.7),
      inset 0 0 28px rgba(75, 227, 255, 0.22);
  }
}
.btn-icon {
  font-size: 20px;
  filter: drop-shadow(0 0 6px rgba(75,227,255,0.5));
  transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  display: inline-block;
}
.btn:hover .btn-icon { transform: scale(1.18) rotate(-5deg); }
.btn.active .btn-icon { animation: btnIconBob 2s ease-in-out infinite; }
@keyframes btnIconBob {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}
.color-palette { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.color-swatch {
  width: 48px; height: 48px;
  border-radius: 14px;
  cursor: pointer;
  border: 1.5px solid rgba(255, 255, 255, 0.35);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1),
              border-color 0.25s, box-shadow 0.3s;
  position: relative;
  /* Глянцевая капля: верхний specular + нижняя теневая кромка */
  box-shadow:
    inset 0 2px 0 rgba(255, 255, 255, 0.45),
    inset 0 -2px 4px rgba(0, 0, 0, 0.25),
    inset 0 0 0 1px rgba(255, 255, 255, 0.05),
    0 6px 16px rgba(0, 0, 0, 0.4);
}
.color-swatch:hover {
  transform: scale(1.18) rotate(8deg);
  border-color: var(--accent-primary);
  box-shadow: 0 0 25px var(--accent-primary);
}
.color-swatch:active { transform: scale(1.05) rotate(-4deg); transition: transform 0.1s; }
.color-swatch.active {
  border-color: var(--accent-primary);
  box-shadow: 0 0 30px var(--accent-primary);
  transform: scale(1.12);
  animation: swatchActivePulse 2.4s ease-in-out infinite;
}
@keyframes swatchActivePulse {
  0%, 100% { box-shadow: 0 0 25px var(--accent-primary); }
  50%      { box-shadow: 0 0 40px var(--accent-primary), 0 0 60px rgba(75,227,255,0.4); }
}
.color-swatch.active::after {
  content: '✓';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) scale(1);
  color: white;
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 0 8px rgba(0,0,0,0.6);
  animation: swatchCheckPop 0.4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes swatchCheckPop {
  0%   { transform: translate(-50%,-50%) scale(0); opacity: 0; }
  100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
}
.color-picker { width: 100%; height: 48px; border: 1px solid rgba(255,255,255,0.15); border-radius: 18px; overflow: hidden; cursor: pointer; background: var(--surface-elevated); padding: 4px; transition: var(--transition-smooth); box-shadow: inset 0 2px 10px rgba(0,0,0,0.4); }
.color-picker:hover { border-color: var(--accent-primary); box-shadow: 0 0 20px rgba(75,227,255,0.35); }
.color-picker::-webkit-color-swatch-wrapper { padding: 0; }
.color-picker::-webkit-color-swatch { border: none; border-radius: 14px; min-height: 40px; }
.slider-container { position: relative; margin-top: 4px; }
.slider-label { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 15px; color: var(--text-soft); padding: 0 2px; }
.slider-value { color: var(--accent-primary); font-weight: 700; background: rgba(75,227,255,0.15); padding: 4px 12px; border-radius: 30px; font-size: 14px; border: 1px solid rgba(75,227,255,0.4); }
.slider {
  width: 100%; height: 8px;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  outline: none;
  -webkit-appearance: none; appearance: none;
  box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.6), inset 0 -1px 0 rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.06);
  transition: box-shadow 0.3s ease;
}
.slider { transition: box-shadow 0.3s ease; }
.slider:hover { box-shadow: inset 0 1px 8px rgba(0,0,0,0.6), 0 0 14px rgba(75,227,255,0.25); }
.slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 26px; height: 26px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 45%),
    radial-gradient(circle at 30% 30%, var(--accent-primary), #1aabff 100%);
  cursor: pointer;
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  box-shadow:
    0 2px 12px var(--accent-primary),
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    inset 0 -2px 4px rgba(0, 0, 0, 0.35);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
}
.slider::-webkit-slider-thumb:hover {
  transform: scale(1.3);
  box-shadow: 0 0 25px var(--accent-primary), 0 0 40px rgba(75,227,255,0.5);
}
.slider::-webkit-slider-thumb:active { transform: scale(1.15); }
.slider::-moz-range-thumb {
  width: 26px; height: 26px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0) 45%),
    radial-gradient(circle at 30% 30%, var(--accent-primary), #1aabff 100%);
  cursor: pointer;
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  box-shadow: 0 2px 12px var(--accent-primary),
              inset 0 1px 0 rgba(255, 255, 255, 0.7),
              inset 0 -2px 4px rgba(0, 0, 0, 0.35);
  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s ease;
}
.slider::-moz-range-thumb:hover { transform: scale(1.3); box-shadow: 0 0 25px var(--accent-primary); }
.slider-value { transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), background 0.25s; }
.slider-container:hover .slider-value {
  transform: scale(1.08);
  background: rgba(75,227,255,0.3);
}
.toggle-group { display: flex; align-items: center; justify-content: space-between; padding: 10px 6px; background: rgba(0,0,0,0.25); border-radius: 40px; border: 1px solid rgba(255,255,255,0.08); }
.toggle-label { font-size: 17px; font-weight: 600; color: var(--text-soft); }
.toggle-btn {
  position: relative;
  width: 58px; height: 32px;
  background: rgba(0, 0, 0, 0.35);

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8";

// ── STATE ──────────────────────────────────────────────────────────────

// ══════════════════════════════════════════════════════════════════════
//  🦴 3D TUBE HAND RENDERER (обволакивает кости скелета)
// ══════════════════════════════════════════════════════════════════════
function getHandLabel(cat) { return isCameraMirrored ? (cat==='Left'?'R':'L') : (cat==='Left'?'L':'R'); }
function getScheme(label) {
  const c = label==='L' ? {b:[18,140,210],d:[5,60,120],br:[100,220,255]} : {b:[140,45,195],d:[55,8,100],br:[210,140,255]};
  const glow = label==='L' ? 'rgba(75,227,255,0.5)' : 'rgba(192,132,252,0.5)';
  const acc = label==='L' ? '#4be3ff' : '#c084fc';
  return { base:c.b, dark:c.d, bright:c.br, ao:[3,35,80], glow, accent:acc, outline: label==='L'?'rgba(20,200,255,0.8)':'rgba(180,100,255,0.8)' };
}
function rgb(c, a=1) { return a<1 ? `rgba(${c[0]},${c[1]},${c[2]},${a})` : `rgb(${c[0]},${c[1]},${c[2]})`; }

const FINGER_CHAINS = [[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20]];
const PALM_LINKS = [[0,5],[0,9],[0,13],[0,17],[5,9],[9,13],[13,17]];

function drawHand3D(landmarks, categoryName, W, H) {
  const label = getHandLabel(categoryName), scheme = getScheme(label), pts = landmarks.map(lm => lmXY(lm, W, H));
  const wrist = pts[0], midBase = pts[9], handSpan = Math.hypot(midBase.x-wrist.x, midBase.y-wrist.y);
  const scale = Math.max(0.5, Math.min(2.2, handSpan/150));

  const drawTube = (p1, p2, r1, r2) => {
    const dx=p2.x-p1.x, dy=p2.y-p1.y, len=Math.hypot(dx,dy); if(len<2) return;
    const nx=-dy/len, ny=dx/len;
    const corners = [[p1.x+nx*r1,p1.y+ny*r1],[p2.x+nx*r2,p2.y+ny*r2],[p2.x-nx*r2,p2.y-ny*r2],[p1.x-nx*r1,p1.y-ny*r1]];
    sCtx.save(); sCtx.shadowColor='rgba(0,0,0,0.5)'; sCtx.shadowBlur=r1*3; sCtx.shadowOffsetX=r1*0.4; sCtx.shadowOffsetY=r1*0.5; sCtx.fillStyle='rgba(0,0,0,0.01)'; sCtx.beginPath(); sCtx.moveTo(...corners[0]); sCtx.lineTo(...corners[1]); sCtx.lineTo(...corners[2]); sCtx.lineTo(...corners[3]); sCtx.closePath(); sCtx.fill(); sCtx.restore();
    const midX=(p1.x+p2.x)/2, midY=(p1.y+p2.y)/2;
    const grad=sCtx.createLinearGradient(midX+nx*r1, midY+ny*r1, midX-nx*r1, midY-ny*r1);
    grad.addColorStop(0, rgb(scheme.dark)); grad.addColorStop(0.3, rgb(scheme.base)); grad.addColorStop(0.5, rgb(scheme.bright)); grad.addColorStop(0.7, rgb(scheme.base)); grad.addColorStop(1, rgb(scheme.dark));
    sCtx.fillStyle=grad; sCtx.beginPath(); sCtx.moveTo(...corners[0]); sCtx.lineTo(...corners[1]); sCtx.lineTo(...corners[2]); sCtx.lineTo(...corners[3]); sCtx.closePath(); sCtx.fill();
    const hR=r1*0.3; sCtx.strokeStyle='rgba(255,255,255,0.6)'; sCtx.lineWidth=Math.max(1, hR*0.9); sCtx.lineCap='round'; sCtx.beginPath(); sCtx.moveTo(p1.x+nx*hR*0.5, p1.y+ny*hR*0.5); sCtx.lineTo(p2.x+nx*hR*0.5, p2.y+ny*hR*0.5); sCtx.stroke();
  };
  const drawSphere = (p, r) => {
    sCtx.save(); sCtx.shadowColor='rgba(0,0,0,0.6)'; sCtx.shadowBlur=r*2; sCtx.shadowOffsetX=r*0.3; sCtx.shadowOffsetY=r*0.4;
    const grad=sCtx.createRadialGradient(p.x-r*0.35, p.y-r*0.35, 0, p.x, p.y, r);
    grad.addColorStop(0, rgb(scheme.bright)); grad.addColorStop(0.4, rgb(scheme.base)); grad.addColorStop(1, rgb(scheme.dark));
    sCtx.fillStyle=grad; sCtx.beginPath(); sCtx.arc(p.x, p.y, r, 0, Math.PI*2); sCtx.fill();
    sCtx.fillStyle='rgba(255,255,255,0.85)'; sCtx.beginPath(); sCtx.arc(p.x-r*0.35, p.y-r*0.35, r*0.22, 0, Math.PI*2); sCtx.fill(); sCtx.restore();

  for(const [a,b] of PALM_LINKS) drawTube(pts[a], pts[b], 5*scale, 5*scale);
  for(const chain of FINGER_CHAINS) for(let i=0; i<chain.length-1; i++) {
    const isTip=i===chain.length-2; drawTube(pts[chain[i]], pts[chain[i+1]], 6*scale, isTip?3.5*scale:5*scale);
  }
  for(const p of pts) drawSphere(p, 5.5*scale);

  sCtx.save(); sCtx.shadowColor=scheme.accent; sCtx.shadowBlur=14; sCtx.fillStyle=scheme.accent; sCtx.beginPath(); sCtx.roundRect(pts[0].x-16, pts[0].y-30, 32, 22, 10); sCtx.fill(); sCtx.restore();
  sCtx.fillStyle='#000'; sCtx.font=`bold ${Math.max(12, 15*scale)}px "Inter",sans-serif`; sCtx.textAlign='center'; sCtx.textBaseline='middle'; sCtx.fillText(label, pts[0].x, pts[0].y-19);
  sCtx.save(); sCtx.globalCompositeOperation='screen'; sCtx.globalAlpha=0.12; sCtx.shadowColor=scheme.glow; sCtx.shadowBlur=40; sCtx.fillStyle=scheme.glow; sCtx.beginPath(); sCtx.arc(pts[0].x, pts[0].y, handSpan*0.65, 0, Math.PI*2); sCtx.fill(); sCtx.restore();
}

const BONE_PAL = ['#fff','#ff6b6b','#ff6b6b','#ff6b6b','#ff6b6b','#4be3ff','#4be3ff','#4be3ff','#4be3ff','#a8ff78','#a8ff78','#a8ff78','#a8ff78','#f8cd57','#f8cd57','#f8cd57','#f8cd57','#c084fc','#c084fc','#c084fc','#c084fc'];
const SKEL_CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
function drawSkeletonOnly(landmarks, categoryName, W, H) {
  const label=getHandLabel(categoryName), scheme=getScheme(label), pts=landmarks.map(lm=>lmXY(lm,W,H));
  sCtx.lineCap='round';
  for(const[a,b] of SKEL_CONN){const pa=pts[a],pb=pts[b];const g=sCtx.createLinearGradient(pa.x,pa.y,pb.x,pb.y);g.addColorStop(0,BONE_PAL[a]??'#fff');g.addColorStop(1,BONE_PAL[b]??'#fff');sCtx.save();sCtx.shadowColor=BONE_PAL[b];sCtx.shadowBlur=8;sCtx.strokeStyle=g;sCtx.lineWidth=2.5;sCtx.globalAlpha=0.5;sCtx.beginPath();sCtx.moveTo(pa.x,pa.y);sCtx.lineTo(pb.x,pb.y);sCtx.stroke();sCtx.restore();sCtx.strokeStyle=g;sCtx.lineWidth=1.5;sCtx.globalAlpha=1;sCtx.beginPath();sCtx.moveTo(pa.x,pa.y);sCtx.lineTo(pb.x,pb.y);sCtx.stroke();}

function drawAction(action,tc=ctx,tcanvas=canvas,isPreview=false){if(!action)return;tc.save();tc.strokeStyle=action.color;tc.fillStyle=action.color;tc.lineWidth=action.width;tc.lineCap='round';tc.lineJoin='round';tc.globalAlpha=isPreview?0.7:action.opacity;const W=tcanvas.width,H=tcanvas.height;switch(action.type){case'pen':dPen(action,tc,W,H);break;case'line':dLine(action,tc,W,H);break;case'rect':dRect(action,tc,W,H);break;case'circle':dCircle(action,tc,W,H);break;case'triangle':dTriangle(action,tc,W,H);break;case'arrow':dArrow(action,tc,W,H);break;}tc.restore();}
function dPen(a,c,W,H){const p=a.points;if(p.length<2)return;c.beginPath();c.moveTo(p[0].x*W,p[0].y*H);for(let i=1;i<p.length;i++){const q=p[i-1],r=p[i];c.quadraticCurveTo(q.x*W,q.y*H,(q.x+r.x)/2*W,(q.y+r.y)/2*H);}c.stroke();}
function dLine(a,c,W,H){c.beginPath();c.moveTo(a.start.x*W,a.start.y*H);c.lineTo(a.end.x*W,a.end.y*H);c.stroke();}
function dRect(a,c,W,H){c.strokeRect(Math.min(a.start.x,a.end.x)*W,Math.min(a.start.y,a.end.y)*H,Math.abs(a.end.x-a.start.x)*W,Math.abs(a.end.y-a.start.y)*H);}
function dCircle(a,c,W,H){c.beginPath();c.arc((a.start.x+a.end.x)/2*W,(a.start.y+a.end.y)/2*H,Math.hypot(a.end.x-a.start.x,a.end.y-a.start.y)*W/2,0,Math.PI*2);c.stroke();}
function dTriangle(a,c,W,H){const x1=a.start.x*W,y1=a.start.y*H,x2=a.end.x*W,y2=a.end.y*H;c.beginPath();c.moveTo(x1,y2);c.lineTo((x1+x2)/2,y1);c.lineTo(x2,y2);c.closePath();c.stroke();}
function dArrow(a,c,W,H){const sx=a.start.x*W,sy=a.start.y*H,ex=a.end.x*W,ey=a.end.y*H;const len=Math.hypot(ex-sx,ey-sy);if(len<1)return;const angle=Math.atan2(ey-sy,ex-sx),hl=Math.max(8,Math.min(len*.2,120));c.beginPath();c.moveTo(sx,sy);c.lineTo(ex,ey);c.lineTo(ex-hl*Math.cos(angle-Math.PI/6),ey-hl*Math.sin(angle-Math.PI/6));c.moveTo(ex,ey);c.lineTo(ex-hl*Math.cos(angle+Math.PI/6),ey-hl*Math.sin(angle+Math.PI/6));c.stroke();}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(state.backgroundImage)ctx.drawImage(state.backgroundImage,0,0,canvas.width,canvas.height);
  let lineOpacity=1;
  if(dissolveActive)lineOpacity=updateDissolve();
  if(lineOpacity>0&&state.actions.length>0){
    if(lineOpacity<1){ctx.save();ctx.globalAlpha=lineOpacity;state.actions.forEach(a=>drawAction(a));ctx.restore();}
    else state.actions.forEach(a=>drawAction(a));
  }
  if(state.current)drawAction(state.current,ctx,canvas,true);
  if(dissolveActive)drawDissolveParticles();
  historyCountEl.textContent=state.actions.length;
}

// ── GESTURE ENGINE ──────────────────────────────────────────────────────
const vision=await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm");
const hand=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-assets/hand_landmarker.task"},runningMode:"VIDEO",numHands:2,minHandDetectionConfidence:0.5,minTrackingConfidence:0.5});
const PINCH_THRESHOLD=0.08,SMOOTHING_FACTOR=0.3,FIST_MAX_DIST=0.15,FIST_TIPS=[4,8,12,16,20];
// Двойная экспоненциальная фильтрация — как в 3D, ощутимо убирает дрожь
let drawing=false,lastPoint=null,smoothCursor={x:0.5,y:0.5},_lastCursorTime=0;
const CURSOR_UPDATE_INTERVAL=16;
function isFistGesture(lm){const w=lm[0];return FIST_TIPS.every(i=>Math.hypot(lm[i].x-w.x,lm[i].y-w.y)<FIST_MAX_DIST);}
function cloneAction(a){return a.type==='pen'?{...a,points:a.points.map(p=>({...p}))}:{...a,start:{...a.start},end:{...a.end}};}

// ── 💎 INFINITY SNAP GESTURE ──────────────────────────────────────────
// Открытая правая ладонь к камере + удержание 2с → появляются 6 камней,
// затем щелчок (большой+средний палец) → все линии исчезают пылью.
// (SNAP / dissolveActive объявлены выше, чтобы draw() при первом ресайзе не упал в TDZ)
// Камни на основаниях пальцев + один в центре ладони
const STONES=[
  {lm:5,      rgb:'255,48,48',  glow:'#ff3030'}, // Reality (red)    — основание указательного
  {lm:9,      rgb:'255,215,0',  glow:'#ffd700'}, // Mind (yellow)    — основание среднего
  {lm:13,     rgb:'0,255,128',  glow:'#00ff80'}, // Time (green)     — основание безымянного
  {lm:17,     rgb:'255,128,0',  glow:'#ff8000'}, // Soul (orange)    — основание мизинца
  {lm:2,      rgb:'160,32,255', glow:'#a020ff'}, // Power (purple)   — основание большого
  {lm:'palm', rgb:'48,128,255', glow:'#3080ff'}, // Space (blue)     — центр ладони
];
const DISSOLVE_MS=2000;

function getUserHandLabel(c){if(!c)return'?';return isCameraMirrored?(c==='Left'?'R':'L'):(c==='Left'?'L':'R');}
function detectPalmFacing(lm){
  const w=lm[0],iM=lm[5],pM=lm[17];
  const cross=(iM.x-w.x)*(pM.y-w.y)-(iM.y-w.y)*(pM.x-w.x);
  // Правая рука тыльной стороной к камере (ладонь от камеры):
  // cross > 0 без зеркала, < 0 с зеркалом — инвертировано относительно palm-facing
  return isCameraMirrored?cross<-SNAP.PALM_THR:cross>SNAP.PALM_THR;
}
function detectSnap(lm){return Math.hypot(lm[4].x-lm[12].x,lm[4].y-lm[12].y)<SNAP.SNAP_DIST;}
function detectFingersExtended(lm){
  // Минимум 3 из 4 пальцев должны быть вытянуты — чтобы лёгкое согнутие не отменяло жест
  const w=lm[0];
  const ok=[8,12,16,20].filter(i=>Math.hypot(lm[i].x-w.x,lm[i].y-w.y)>SNAP.EXTENDED_DIST).length;
  return ok>=3;
}
function snapHint(text){
  // Подсказка обновляется не чаще раза в 600 мс, чтобы не дёргать DOM
  const now=performance.now();
  if(text===SNAP.lastHint||now-SNAP.lastHintTime<600)return;
  SNAP.lastHint=text;SNAP.lastHintTime=now;
  showHoverIndicator(text);
}
function updateSnapGesture(lm,userHand){
  if(userHand!=='R'){
    if(SNAP.state!=='SNAPPING'){SNAP.state='IDLE';SNAP.charge=0;SNAP.history.length=0;SNAP.lastHint='';}
    return;
  }
  const w=lm[0];
  SNAP.history.push({x:w.x,y:w.y});
  if(SNAP.history.length>SNAP.HIST_SIZE)SNAP.history.shift();
  let stationary=false;
  if(SNAP.history.length>=SNAP.HIST_SIZE){
    const f=SNAP.history[0];let m=0;
    for(const p of SNAP.history){const d=Math.hypot(p.x-f.x,p.y-f.y);if(d>m)m=d;}
    stationary=m<SNAP.STATIONARY_THR;
  }
  const palm=detectPalmFacing(lm),ext=detectFingersExtended(lm);
  switch(SNAP.state){
    case'IDLE':
      if(palm&&stationary&&ext){
        SNAP.state='CHARGING';SNAP.chargeStart=performance.now();SNAP.charge=0;
      } else if(palm&&ext){
        snapHint('⏸ Замри на 3 с');
      } else if(palm){
        snapHint('✋ Раскрой пальцы');
      } else if(ext){
        snapHint('🖐️ Поверни тыльной стороной к камере');
      }
      break;
    case'CHARGING':
      if(palm&&ext){
        SNAP.charge=Math.min((performance.now()-SNAP.chargeStart)/SNAP.CHARGE_MS,1);
        if(SNAP.charge>=1)SNAP.state='READY';
      } else {
        // Плавное угасание заряда вместо мгновенного сброса — терпим короткие сбои трекинга
        SNAP.charge=Math.max(0,SNAP.charge-0.05);
        if(SNAP.charge<=0){SNAP.state='IDLE';}
        else {SNAP.chargeStart=performance.now()-SNAP.charge*SNAP.CHARGE_MS;}
      }
      break;
    case'READY':
      snapHint('✨ Щёлкни большим и средним');
      if(detectSnap(lm)){SNAP.state='SNAPPING';triggerSnap();}
      break;
  }
}
function triggerSnap(){
  startDissolve();
  showHoverIndicator('💥 SNAP — линии исчезают');
  snapFlashAlpha=0.8;
  setTimeout(()=>{SNAP.state='IDLE';SNAP.charge=0;SNAP.history.length=0;},2400);
}

function drawInfinityGems(lm){
  if(SNAP.state==='IDLE'||SNAP.charge<=0)return;
  const W=skeletonCanvas.width,H=skeletonCanvas.height,t=performance.now()*0.003;
  // Центр ладони — среднее между запястьем и MCP среднего пальца с лёгким смещением к ладони
  const palmX=(lm[0].x+lm[9].x)*0.5, palmY=(lm[0].y+lm[9].y)*0.5;
  STONES.forEach((s,i)=>{
    const sc=Math.max(0,Math.min(1,SNAP.charge*6-i));
    if(sc<=0)return;
    const p=(s.lm==='palm')?{x:palmX,y:palmY}:lm[s.lm];
    if(!p)return;
    const sx=(isCameraMirrored?(1-p.x):p.x)*W,sy=p.y*H;
    const wob=0.92+Math.sin(t+i)*0.08;
    const r=(8+sc*7)*wob;
    sCtx.save();
    sCtx.shadowColor=s.glow;sCtx.shadowBlur=28*sc;
    sCtx.fillStyle=`rgba(${s.rgb},${sc*0.45})`;
    sCtx.beginPath();sCtx.arc(sx,sy,r*1.9,0,Math.PI*2);sCtx.fill();
    sCtx.fillStyle=`rgba(${s.rgb},${sc})`;
    sCtx.beginPath();sCtx.arc(sx,sy,r,0,Math.PI*2);sCtx.fill();
    sCtx.fillStyle=`rgba(255,255,255,${sc*0.85})`;
    sCtx.beginPath();sCtx.arc(sx-r*0.32,sy-r*0.32,r*0.32,0,Math.PI*2);sCtx.fill();
    sCtx.restore();
  });
  if(SNAP.state==='READY'){
    const w=lm[0];
    const wsx=(isCameraMirrored?(1-w.x):w.x)*W,wsy=w.y*H;
    const pulse=0.6+0.4*Math.sin(t*4);
    sCtx.save();
    sCtx.strokeStyle=`rgba(255,200,80,${pulse*0.7})`;
    sCtx.lineWidth=3*pulse;sCtx.shadowColor='#ffaa30';sCtx.shadowBlur=30;
    sCtx.beginPath();sCtx.arc(wsx,wsy-70,95,0,Math.PI*2);sCtx.stroke();
    sCtx.restore();
  }
}

// ── DISSOLVE ──────────────────────────────────────────────────────────
function sampleAction(a){
  const W=canvas.width,H=canvas.height,r=[];
  if(a.type==='pen'&&a.points){a.points.forEach(p=>r.push({x:p.x*W,y:p.y*H}));}
  else if(a.start&&a.end){
    const x1=a.start.x*W,y1=a.start.y*H,x2=a.end.x*W,y2=a.end.y*H;
    if(a.type==='rect'){
      const N=42;
      for(let i=0;i<N;i++){const t=i/N;let x,y;
        if(t<0.25){x=x1+(x2-x1)*t*4;y=y1;}
        else if(t<0.5){x=x2;y=y1+(y2-y1)*(t-0.25)*4;}
        else if(t<0.75){x=x2-(x2-x1)*(t-0.5)*4;y=y2;}
        else{x=x1;y=y2-(y2-y1)*(t-0.75)*4;}
        r.push({x,y});
      }
    }else if(a.type==='circle'){
      const cx=(x1+x2)/2,cy=(y1+y2)/2,rr=Math.hypot(x2-x1,y2-y1)/2,N=50;
      for(let i=0;i<N;i++){const ang=i/N*Math.PI*2;r.push({x:cx+Math.cos(ang)*rr,y:cy+Math.sin(ang)*rr});}
    }else if(a.type==='triangle'){
      const apex={x:(x1+x2)/2,y:y1},left={x:x1,y:y2},right={x:x2,y:y2};
      [[apex,left],[left,right],[right,apex]].forEach(([a,b])=>{const N=18;for(let i=0;i<N;i++){const t=i/N;r.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});}});
    }else{const N=36;for(let i=0;i<=N;i++){const t=i/N;r.push({x:x1+(x2-x1)*t,y:y1+(y2-y1)*t});}}
  }
  return r;
}

function startDissolve(){
  if(dissolveActive)return;
  if(state.actions.length===0&&!state.current)return;
  const all=state.actions.slice();if(state.current)all.push(state.current);
  const ps=[];
  all.forEach(a=>{
    const samples=sampleAction(a);
    samples.forEach(pt=>{
      const cnt=1+Math.floor(Math.random()*2);
      for(let i=0;i<cnt;i++){
        ps.push({
          x:pt.x+(Math.random()-0.5)*4, y:pt.y+(Math.random()-0.5)*4,
          vx:(Math.random()-0.5)*1.6, vy:-Math.random()*1.8-0.3,
          ax:(Math.random()-0.5)*0.02, ay:-0.025,
          size:1.2+Math.random()*2.4,
          color:a.color,
          baseAlpha:0.7+Math.random()*0.3,
          life:1,
          decay:0.005+Math.random()*0.008,
        });
      }
    });
  });
  dissolveParticles=ps;
  dissolveActive=true;
  dissolveStart=performance.now();
}

function updateDissolve(){
  if(!dissolveActive)return 1;
  const elapsed=performance.now()-dissolveStart;
  const lineOpacity=Math.max(0,1-elapsed/600);
  for(let i=dissolveParticles.length-1;i>=0;i--){
    const p=dissolveParticles[i];
    p.vx+=p.ax;p.vy+=p.ay;
    p.x+=p.vx;p.y+=p.vy;
    p.life-=p.decay;
    if(p.life<=0)dissolveParticles.splice(i,1);
  }
  if(elapsed>=600&&state.actions.length>0){
    state.actions=[];state.redo=[];state.current=null;drawing=false;
  }
  if(elapsed>=DISSOLVE_MS){dissolveActive=false;dissolveParticles=[];}
  return lineOpacity;
}

function drawDissolveParticles(){
  ctx.save();
  for(const p of dissolveParticles){
    if(p.life<=0)continue;
    ctx.globalAlpha=p.life*p.baseAlpha;
    ctx.fillStyle=p.color;
    ctx.shadowColor=p.color;ctx.shadowBlur=6;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  if(snapFlashAlpha>0){
    ctx.save();
    ctx.fillStyle=`rgba(255,220,140,${snapFlashAlpha})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.restore();
    snapFlashAlpha*=0.85;
    if(snapFlashAlpha<0.01)snapFlashAlpha=0;
  }
}

function handleHands(allLM,allHand){
  const count=allLM?.length??0; handCountEl.textContent=count;
  if(!count){
    pinchCursor.style.display='none';resetAllZones();
    sCtx.clearRect(0,0,skeletonCanvas.width,skeletonCanvas.height);
    if(SNAP.state!=='SNAPPING'){SNAP.state='IDLE';SNAP.charge=0;SNAP.history.length=0;}
    return;
  }
  drawAllHands(allLM,allHand);
  const lm=allLM[0];if(!lm||lm.length<21)return;
  // 💎 Snap-жест (если включён): ищем правую руку среди всех обнаруженных
  if(snapGestureEnabled){
    let rightIdx=-1;
    for(let i=0;i<allLM.length;i++){
      if(getUserHandLabel(allHand?.[i]?.[0]?.categoryName)==='R'){rightIdx=i;break;}
    }
    if(rightIdx>=0){
      updateSnapGesture(allLM[rightIdx],'R');
      drawInfinityGems(allLM[rightIdx]);
    } else {
      updateSnapGesture(lm,'?');
    }
  } else if(SNAP.state!=='IDLE'){
    // Принудительно сбрасываем, если жест отключили во время работы
    SNAP.state='IDLE';SNAP.charge=0;SNAP.history.length=0;
  }
  pinchCursor.style.display='block';
  const thumb=lm[4],idx=lm[8];
  const isPinching=Math.hypot(thumb.x-idx.x,thumb.y-idx.y)<PINCH_THRESHOLD;
  const isFistNow=isFistGesture(lm);
  if(isFistNow&&!wasFist&&fistToggleCooldown<=0){wasFist=true;fistToggleCooldown=30;pinchCursor.classList.add('cursor-fist');setTimeout(()=>pinchCursor.classList.remove('cursor-fist'),500);}
  else if(!isFistNow)wasFist=false;
  if(fistToggleCooldown>0)fistToggleCooldown--;
  // ── ДВОЙНОЕ СГЛАЖИВАНИЕ (как в 3D) ──────────────────────────────────
  // 1) первый каскад на сырых координатах — убирает крупные скачки
  let rx=idx.x,ry=idx.y;
  if(lastPoint){rx=lastPoint.x*(1-SMOOTHING_FACTOR)+rx*SMOOTHING_FACTOR;ry=lastPoint.y*(1-SMOOTHING_FACTOR)+ry*SMOOTHING_FACTOR;}
  lastPoint={x:rx,y:ry};
  // 2) второй каскад — стабильный exponential moving average для позиции курсора
  smoothCursor.x=smoothCursor.x*0.55+rx*0.45;
  smoothCursor.y=smoothCursor.y*0.55+ry*0.45;
  rx=smoothCursor.x;ry=smoothCursor.y;
  const sx=isCameraMirrored?(1-rx)*window.innerWidth:rx*window.innerWidth;
  const sy=ry*window.innerHeight;
  // Throttle до 60 fps, чтобы не дёргать DOM на каждом detect-кадре
  const _now=performance.now();
  if(_now-_lastCursorTime>=CURSOR_UPDATE_INTERVAL){
    _lastCursorTime=_now;
    pinchCursor.style.left=sx+'px';pinchCursor.style.top=sy+'px';
  }
  pinchCursor.classList.toggle('active',isPinching&&!isFistNow);
  // Если в процессе snap-жеста — отключаем рисование, UI-клики и зоны
  if(SNAP.state==='CHARGING'||SNAP.state==='READY'||SNAP.state==='SNAPPING'){
    resetAllZones();
    return;
  }
  tickHotZones(sx,sy);
  if(activeZone||isFistNow)return;
  if(currentMode==='ui')handleUIClick({x:rx,y:ry},isPinching);
  else handleDrawing({x:rx,y:ry},isPinching);
}
function toCanvas(p){return{x:isCameraMirrored?1-p.x:p.x,y:p.y};}
function handleDrawing(point,isPinching){const dp=toCanvas(point);if(isPinching&&!drawing){drawing=true;state.current=state.tool==='pen'?{type:'pen',color:state.color,width:state.width,opacity:state.opacity,points:[{...dp}]}:{type:state.tool,color:state.color,width:state.width,opacity:state.opacity,start:{...dp},end:{...dp}};return;}if(isPinching&&drawing&&state.current){if(state.current.type==='pen')state.current.points.push({...dp});else state.current.end={...dp};return;}if(!isPinching&&drawing&&state.current){drawing=false;const valid=state.current.type==='pen'?state.current.points.length>2:Math.hypot(state.current.end.x-state.current.start.x,state.current.end.y-state.current.start.y)>0.02;if(valid){state.actions.push(cloneAction(state.current));state.redo=[];}state.current=null;}}
const CLICKABLE_SEL='.btn,.color-picker,.slider,.toggle-btn,.color-swatch';let isPotentialClick=false,potentialClickEl=null,clickStartTime=0;const CLICK_THRESHOLD=500;
function getClickable(el){return el?.matches(CLICKABLE_SEL)?el:el?.closest(CLICKABLE_SEL);}
function highlightEl(el,on){if(!el)return;el.style.outline=on?'3px solid var(--accent-primary)':'';el.style.outlineOffset=on?'4px':'';el.style.boxShadow=on?'0 0 30px var(--accent-primary)':'';}
function fireClick(el){if(!el)return;if(el.classList.contains('color-swatch')){if(el.dataset.color){setColor(el.dataset.color);showClickFeedback(el);}return;}if(el.tagName==='BUTTON'){el.click();const orig=el.style.background;el.style.background='rgba(75,227,255,0.3)';setTimeout(()=>{el.style.background=orig;},200);}else if(el.type==='range'){const rect=el.getBoundingClientRect();const dx=isCameraMirrored?(1-lastPoint.x):lastPoint.x;const ratio=Math.max(0,Math.min(1,(dx*window.innerWidth-rect.left)/rect.width));el.value=+el.min+ratio*(+el.max-+el.min);el.dispatchEvent(new Event('input'));el.dispatchEvent(new Event('change'));}else if(el.type==='color')el.click();showClickFeedback(el);}
function showClickFeedback(el){const r=el.getBoundingClientRect();const d=document.createElement('div');d.className='feedback-ripple';d.style.left=r.left+r.width/2+'px';d.style.top=r.top+r.height/2+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),400);}
function handleUIClick(point,isPinching){const sx=isCameraMirrored?(1-point.x)*window.innerWidth:point.x*window.innerWidth;const el=getClickable(document.elementFromPoint(sx,point.y*window.innerHeight));if(el!==potentialClickEl){highlightEl(potentialClickEl,false);potentialClickEl=el;highlightEl(el,true);}if(isPinching&&!isPotentialClick){isPotentialClick=true;clickStartTime=Date.now();}if(!isPinching&&isPotentialClick){if(Date.now()-clickStartTime<CLICK_THRESHOLD)fireClick(el);isPotentialClick=false;clickStartTime=0;}if(isPinching&&isPotentialClick&&Date.now()-clickStartTime>CLICK_THRESHOLD)isPotentialClick=false;}
function hexToRgb(hex){const r=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);return r?`${parseInt(r[1],16)},${parseInt(r[2],16)},${parseInt(r[3],16)}`:'255,0,0';}

function loop(){if(video.readyState>=2){const res=hand.detectForVideo(video,performance.now());if(res.landmarks?.length)handleHands(res.landmarks,res.handednesses);else{pinchCursor.style.display='none';resetAllZones();sCtx.clearRect(0,0,skeletonCanvas.width,skeletonCanvas.height);handCountEl.textContent='0';}}draw();requestAnimationFrame(loop);}
setTool('pen');switchMode('drawing');toggleSkeletonVisibility(true);loop();
</script>
